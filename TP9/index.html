<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de campeonato a videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container my-5" id="datos-del-jugador">
        <h1 class="mb-4">Registro de campeonato de videojuegos</h1>
        
        <form id="form-registro" novalidate>
            <div class="mb-3">
                <label for="nickname" class="form-label">Nickname:</label>
                <input type="text" class="form-control" id="nickname" required>
                <div class="invalid-feedback" id="error-nickname"></div>  
            </div>

            <div class="mb-3">
                <label for="edad" class="form-label">Edad:</label>
                <input type="text" class="form-control" id="edad" required>
                <div class="invalid-feedback" id="error-edad"></div>
            </div>

            <div class="mb-3">
                <label for="codigo-equipo" class="form-label">Código del equipo:</label>
                <input type="text" class="form-control" id="codigo-equipo" required>
                <div class="invalid-feedback" id="error-codigo"></div>
            </div>

            <div class="mb-4">
                <label class="form-label d-block fw-bold">Selecciona el juego al que deseas inscribirte:</label>
                <div id="grilla-juegos" class="d-flex flex-wrap gap-3">
                    
                    <div class="tarjeta" onclick="seleccionarJuego(this, 'Minecraft')"> 
                        <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png" alt="Minecraft" width="120"> 
                        <p>Minecraft</p> 
                    </div>

                    <div class="tarjeta" onclick="seleccionarJuego(this, 'Fortnite')"> 
                        <img src="https://cdn2.unrealengine.com/fortnite-chapter-5-season-3-key-art-1920x1080-1920x1080-af1f5c4c4b41.jpg" alt="Fortnite" width="120"> 
                        <p>Fortnite</p> 
                    </div>

                    <div class="tarjeta" onclick="seleccionarJuego(this, 'Valorant')"> 
                        <img src="https://upload.wikimedia.org/wikipedia/en/9/97/Valorant_cover.jpg" alt="Valorant" width="120"> 
                        <p>Valorant</p> 
                    </div>

                    <div class="tarjeta" onclick="seleccionarJuego(this, 'FIFA 25')"> 
                        <img src="https://upload.wikimedia.org/wikipedia/en/f/f5/EA_Sports_FC_25_cover.jpg" alt="FIFA 25" width="120"> 
                        <p>FIFA 25</p> 
                    </div>

                    <div class="tarjeta" onclick="seleccionarJuego(this, 'Among Us')"> 
                        <img src="https://upload.wikimedia.org/wikipedia/en/9/93/Among_Us_cover_art.jpg" alt="Among Us" width="120"> 
                        <p>Among Us</p> 
                    </div>

                    <div class="tarjeta" onclick="seleccionarJuego(this, 'Rocket League')"> 
                        <img src="https://upload.wikimedia.org/wikipedia/en/a/ac/Rocket_League_coverart.jpg" alt="Rocket League" width="120"> 
                        <p>Rocket League</p> 
                    </div>

                </div>
                <div id="error-juego" class="text-danger small mt-2 fw-bold"></div>
            </div>

            <button type="submit" class="btn btn-primary">Registrar</button>
            <div id="mensaje-exito" class="mt-3 text-success fw-bold"></div>
        </form>

        <hr class="my-4">

        <div id="seccion-preparacion" class="d-none">
            <h3 class="h5 mb-3">Preguntas de Preparación</h3>
            <button type="button" id="btn-preparacion" class="btn btn-secondary mb-3">Preparación</button>
            <div id="resultado-preparacion" class="p-3 bg-light border rounded"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
